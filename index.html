<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>REMS Control</title>
  <link rel="stylesheet" href="styles.css">

<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">R</div>
      <div><strong>REMS Control</strong><span>Пульт зайнятості</span></div>
    </div>
    <nav>
      <button class="nav active" data-view="dashboard">⌂ <span>Головна</span></button>
      <button class="nav" data-view="students">👥 <span>Студенти</span></button>
      <button class="nav" data-view="projects">🎭 <span>Проєкти</span></button>
      <button class="nav" data-view="calendar">📅 <span>Календар</span></button>
      <button class="nav" data-view="schedule">🧭 <span>Розклад</span></button>
      <button class="nav" data-view="industry">✦ <span>Зустріч із індустрією</span></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="mini" id="backupBtn">Експорт</button>
      <label class="mini file-btn">Імпорт<input id="restoreInput" type="file" accept=".json"></label>
      <div class="sidebar-note" id="cloudStatus">v0.3 · підключення…</div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div><h1 id="pageTitle">Головна</h1><p id="pageSubtitle">Навчальний рік 2026/27 · вересень–травень</p></div>
      <button class="primary" id="quickAdd">+ Новий проєкт</button>
    </header>
    <section id="app"></section>
  </main>

  <dialog id="projectDialog">
    <form method="dialog" id="projectForm">
      <h2>Новий проєкт</h2>
      <label>Назва<input id="projectName" required placeholder="Наприклад: Людина року"></label>
      <div class="split">
        <label>Колір<input id="projectColor" type="color" value="#2563EB"></label>
        <label>Позначка<input id="projectEmoji" maxlength="3" value="◆"></label>
      </div>
      <div class="dialog-actions"><button value="cancel" class="ghost">Скасувати</button><button class="primary" id="saveProject">Зберегти</button></div>
    </form>
  </dialog>

  <dialog id="eventDialog">
    <form method="dialog" id="eventForm">
      <h2>Додати дату</h2>
      <input type="hidden" id="eventProjectId">
      <label>Дата<input id="eventDate" type="date" required></label>
      <label>Тип<input id="eventType" required placeholder="Репетиція / зйомка / подія"></label>
      <div class="dialog-actions"><button value="cancel" class="ghost">Скасувати</button><button class="primary" id="saveEvent">Додати</button></div>
    </form>
  </dialog>

  <dialog id="studentDialog" class="student-dialog">
    <div id="studentDialogBody"></div>
  </dialog>
